#
# windowrulev2 = size 705 466, class:^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
# windowrulev2 = float, class:^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
# windowrulev2 = opacity 0.7 0.5, class:^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
# windowrulev2 = move 100%-w-10 40, class:^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
#
# windowrulev2 = workspace 4 silent, class:^([Ss]team)$
# windowrulev2 = workspace 3 silent, class:^([Dd]iscord|[Vv]esktop|[Ww]ebCord|[Ss]potube|[Ss]potify)$
#
# windowrulev2 = suppressevent maximize, class:.*
# windowrulev2 = size 600 500 nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Pavucontrol Rules (Using the new block syntax for efficiency)
windowrule {
    name = pavucontrol-settings
    match:class = ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
    size = 705 466
    float = true
    opacity = 0.7 0.5
    move = 100%-w-10 40
}

# Workspace Assignments (Explicit class: prefix is now required)
# windowrulev2 = workspace 4 silent, class:^(steam)$
# windowrulev2 = workspace 3 silent, class:^(discord|vesktop|webcord|spotube|spotify)$
# Use 'workspace silent' to force them to their spots without jumping your screen
# windowrulev2 = workspace 3 silent, class:^(discord|WebCord|Vesktop)$
# windowrulev2 = workspace 3 silent, class:^(Spotify)$
# windowrulev2 = workspace 4 silent, class:^(steam)$

# # New 0.53 Syntax (Unified windowrule)
# windowrule = workspace 3 silent match:class discord
# windowrule = workspace 3 silent match:class spotify
# windowrule = workspace 4 silent match:class steam

windowrule = match:class ^(steam)$, workspace 4 silent
windowrule = match:class ^(spotify)$, workspace 3 silent
windowrule = match:class ^(discord)$, workspace 3 silent

# # Global and Utility Rules
# windowrulev2 = suppressevent maximize, class:.*
# windowrulev2 = size 600 500 nofocus, class:^$, title:^$, xwayland:1, floating:1

workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
